<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Makes the website responsive on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Website title -->
  <title>Counter App</title>

  <!-- Connect HTML with CSS -->
  <link rel="stylesheet" href="style.css">
</head>
